name: FATIHA v0.4 Android CI

on:
  workflow_dispatch:
  push:
    paths:
      - 'FATIHA_v0.4_Cloud_Build_Package.zip'
      - 'FATIHA_Android_v0.4_Audio_Content_Management(2)(2).zip'
      - 'FATIHA_v0.4_Audio_Controls_Update.zip'
      - '.github/workflows/fatiha-v04-android-ci.yml'

permissions:
  contents: read

jobs:
  android-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Fetch audio controls source package from Google Drive when absent
        shell: bash
        run: |
          if [ ! -f 'FATIHA_v0.4_Audio_Controls_Update.zip' ]; then
            curl --fail --location --retry 3 --output 'FATIHA_v0.4_Audio_Controls_Update.zip' 'https://drive.google.com/uc?export=download&id=1vdFDIypW65_MEy5ixLKzMXrwmqQNuJEI'
          fi
          unzip -tq 'FATIHA_v0.4_Audio_Controls_Update.zip'

      - name: Extract v0.4 package
        shell: bash
        run: |
          mkdir -p source
          if [ -f 'FATIHA_v0.4_Audio_Controls_Update.zip' ]; then
            unzip -q 'FATIHA_v0.4_Audio_Controls_Update.zip' -d source
            PROJECT_DIR='source/fatiha_android'
          elif [ -f 'FATIHA_v0.4_Cloud_Build_Package.zip' ]; then
            unzip -q 'FATIHA_v0.4_Cloud_Build_Package.zip' -d source
            PROJECT_DIR='source/fatiha_android'
          elif [ -f 'FATIHA_Android_v0.4_Audio_Content_Management(2)(2).zip' ]; then
            unzip -q 'FATIHA_Android_v0.4_Audio_Content_Management(2)(2).zip' -d source
            PUBSPEC_PATH="$(find source -type f -name pubspec.yaml -print -quit)"
            if [ -z "$PUBSPEC_PATH" ]; then
              echo "::error::pubspec.yaml was not found inside the source ZIP."
              exit 1
            fi
            PROJECT_DIR="$(dirname "$PUBSPEC_PATH")"
          else
            echo "::error::Upload the FATIHA v0.4 source ZIP to the repository root."
            exit 1
          fi
          test -f "$PROJECT_DIR/pubspec.yaml"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          if find "$PROJECT_DIR/test" -type f -name '*_test.dart' -print -quit 2>/dev/null | grep -q .; then
            echo "ORIGINAL_TESTS=true" >> "$GITHUB_ENV"
          else
            echo "ORIGINAL_TESTS=false" >> "$GITHUB_ENV"
          fi
          if [ -f "$PROJECT_DIR/test/widget_test.dart" ]; then
            echo "ORIGINAL_WIDGET_TEST=true" >> "$GITHUB_ENV"
          else
            echo "ORIGINAL_WIDGET_TEST=false" >> "$GITHUB_ENV"
          fi
          echo "Flutter project: $PROJECT_DIR"
          find "$PROJECT_DIR" -maxdepth 2 -type f | sort | head -80

      - name: Fix audio controls widget syntax
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/screens/dua_amal_screen.dart')
          s = p.read_text()
          old = "label: Text(_playingId == item.id && _playerState == PlayerState.playing ? 'পজ করুন' : _playingId == item.id && _playerState == PlayerState.paused ? 'আবার চালান' : 'অডিও শুনুন')),\n"
          new = "label: Text(_playingId == item.id && _playerState == PlayerState.playing ? 'পজ করুন' : _playingId == item.id && _playerState == PlayerState.paused ? 'আবার চালান' : 'অডিও শুনুন'))),\n"
          if old not in s:
              raise SystemExit('Expected audio widget syntax pattern was not found; refusing to modify source.')
          p.write_text(s.replace(old, new, 1))
          print('Fixed missing closing parenthesis in Align/TextButton widget.')
          PY

      - name: Prevent repeated content reloads on every rebuild
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/screens/dua_amal_screen.dart')
          s = p.read_text()
          if 'late Future<List<IslamicContent>> _itemsFuture;' not in s:
              s = s.replace('  double _playbackRate = 1.0;\\n', '  double _playbackRate = 1.0;\\n  late Future<List<IslamicContent>> _itemsFuture;\\n', 1)
          if '    _itemsFuture = _load();' not in s:
              s = s.replace('  void initState() {\\n    super.initState();\\n', '  void initState() {\\n    super.initState();\\n    _itemsFuture = _load();\\n', 1)
          if '  void _refreshItems() {' not in s:
              s = s.replace('  @override\\n  void dispose() {', '  void _refreshItems() {\\n    setState(() => _itemsFuture = _load());\\n  }\\n\\n  @override\\n  void dispose() {', 1)
          s = s.replace('future: _load(), builder:', 'future: _itemsFuture, builder:')
          s = s.replace('onChanged: (_) => setState(() {}),', 'onChanged: (_) => _refreshItems(),')
          s = s.replace('onSelected: (_) => setState(() => _category = value),', 'onSelected: (_) => setState(() { _category = value; _itemsFuture = _load(); }),')
          s = s.replace('if (mounted) setState(() {});', 'if (mounted) _refreshItems();')
          s = s.replace('await _repo.setFavorite(item.id!, !item.isFavorite); setState(() {});', 'await _repo.setFavorite(item.id!, !item.isFavorite); _refreshItems();')
          if 'future: _itemsFuture' not in s or '_itemsFuture = _load();' not in s:
              raise SystemExit('Could not apply stable FutureBuilder patch safely')
          p.write_text(s)
          print('Cached content Future so audio/player setState events do not restart SQLite loading.')
          PY

      - name: Generate clean Android wrapper
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          rm -rf android
          flutter create --platforms=android --org com.fatiha --project-name fatiha_islamic_companion .
          sed -i 's#gradle-[0-9.]*-all.zip#gradle-9.5.0-bin.zip#' android/gradle/wrapper/gradle-wrapper.properties
          echo 'Using Gradle wrapper:'
          cat android/gradle/wrapper/gradle-wrapper.properties

      - name: Configure Flutter test SDK and remove generated placeholder
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          if [ "$ORIGINAL_TESTS" = "true" ]; then
            flutter pub add --dev flutter_test --sdk flutter
          fi
          if [ "$ORIGINAL_WIDGET_TEST" != "true" ]; then
            rm -f test/widget_test.dart
          fi

      - name: Resolve dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      - name: Static analysis
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ "$ORIGINAL_TESTS" = "true" ]; then
            flutter test --reporter expanded
          else
            echo "No source test files included; skipping tests."
          fi

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FATIHA-v0.4-debug-apk
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
