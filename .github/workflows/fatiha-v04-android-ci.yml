name: FATIHA v0.4 Android CI

on:
  workflow_dispatch:
  push:
    paths:
      - 'FATIHA_Android_v0.4_Audio_Content_Management(2)(2).zip'
      - '.github/workflows/fatiha-v04-android-ci.yml'

permissions:
  contents: read

jobs:
  android-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Extract v0.4 source archive
        shell: bash
        run: |
          ARCHIVE='FATIHA_Android_v0.4_Audio_Content_Management(2)(2).zip'
          test -f "$ARCHIVE"
          mkdir -p source
          unzip -q "$ARCHIVE" -d source
          echo "Extracted source files:"
          find source -maxdepth 4 -type f | sort | head -100
          PUBSPEC_PATH="$(find source -type f -name pubspec.yaml -print -quit)"
          if [ -z "$PUBSPEC_PATH" ]; then
            echo "::error::pubspec.yaml was not found inside the uploaded ZIP."
            exit 1
          fi
          PROJECT_DIR="$(dirname "$PUBSPEC_PATH")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Flutter project found at: $PROJECT_DIR"

      - name: Generate Android platform scaffold
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter create --platforms=android --org com.fatiha --project-name fatiha_islamic_companion .

      - name: Resolve dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      - name: Static analysis
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter analyze

      - name: Run existing tests
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          if find test -type f -name '*_test.dart' -print -quit 2>/dev/null | grep -q .; then
            flutter test
          else
            echo "No test files were included in the v0.4 source archive; skipping test execution."
          fi

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FATIHA-v0.4-debug-apk
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
