name: FATIHA v0.4 Android CI

on:
  workflow_dispatch:
  push:
    paths:
      - 'FATIHA_v0.4_Cloud_Build_Package.zip'
      - 'FATIHA_Android_v0.4_Audio_Content_Management(2)(2).zip'
      - '.github/workflows/fatiha-v04-android-ci.yml'

permissions:
  contents: read

jobs:
  android-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Extract v0.4 package
        shell: bash
        run: |
          mkdir -p source
          if [ -f 'FATIHA_v0.4_Cloud_Build_Package.zip' ]; then
            unzip -q 'FATIHA_v0.4_Cloud_Build_Package.zip' -d source
            PROJECT_DIR='source/fatiha_android'
          elif [ -f 'FATIHA_Android_v0.4_Audio_Content_Management(2)(2).zip' ]; then
            unzip -q 'FATIHA_Android_v0.4_Audio_Content_Management(2)(2).zip' -d source
            PUBSPEC_PATH="$(find source -type f -name pubspec.yaml -print -quit)"
            if [ -z "$PUBSPEC_PATH" ]; then
              echo "::error::pubspec.yaml was not found inside the source ZIP."
              exit 1
            fi
            PROJECT_DIR="$(dirname "$PUBSPEC_PATH")"
          else
            echo "::error::Upload the FATIHA v0.4 Cloud Build Package ZIP to the repository root."
            exit 1
          fi
          test -f "$PROJECT_DIR/pubspec.yaml"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          if find "$PROJECT_DIR/test" -type f -name '*_test.dart' -print -quit 2>/dev/null | grep -q .; then
            echo "ORIGINAL_TESTS=true" >> "$GITHUB_ENV"
          else
            echo "ORIGINAL_TESTS=false" >> "$GITHUB_ENV"
          fi
          if [ -f "$PROJECT_DIR/test/widget_test.dart" ]; then
            echo "ORIGINAL_WIDGET_TEST=true" >> "$GITHUB_ENV"
          else
            echo "ORIGINAL_WIDGET_TEST=false" >> "$GITHUB_ENV"
          fi
          echo "Flutter project: $PROJECT_DIR"
          find "$PROJECT_DIR" -maxdepth 2 -type f | sort | head -80

      - name: Generate or refresh Android wrapper
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter create --platforms=android --org com.fatiha --project-name fatiha_islamic_companion .

      - name: Configure Flutter test SDK and remove generated placeholder
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          if [ "$ORIGINAL_TESTS" = "true" ]; then
            flutter pub add --dev flutter_test --sdk flutter
          fi
          if [ "$ORIGINAL_WIDGET_TEST" != "true" ]; then
            rm -f test/widget_test.dart
          fi

      - name: Resolve dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      - name: Static analysis
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ "$ORIGINAL_TESTS" = "true" ]; then
            flutter test --reporter expanded
          else
            echo "No source test files included; skipping tests."
          fi

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FATIHA-v0.4-debug-apk
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
