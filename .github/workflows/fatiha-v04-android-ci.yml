name: FATIHA v0.4 Android CI

on:
  workflow_dispatch:
  push:
    paths:
      - 'FATIHA_Android_v0.4_Audio_Content_Management(2)(2).zip'
      - '.github/workflows/fatiha-v04-android-ci.yml'

permissions:
  contents: read

jobs:
  android-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Extract v0.4 source archive
        run: |
          test -f FATIHA_Android_v0.4_Audio_Content_Management(2)(2).zip
          unzip -q FATIHA_Android_v0.4_Audio_Content_Management(2)(2).zip -d source
          test -f source/fatiha_android/pubspec.yaml
      - name: Generate Android platform scaffold
        working-directory: source/fatiha_android
        run: flutter create --platforms=android --org com.fatiha --project-name fatiha_islamic_companion .
      - name: Resolve dependencies
        working-directory: source/fatiha_android
        run: flutter pub get
      - name: Static analysis
        working-directory: source/fatiha_android
        run: flutter analyze
      - name: Run tests
        working-directory: source/fatiha_android
        run: |
          mkdir -p test
          cat > test/islamic_content_test.dart <<'EOF'
          import 'package:flutter_test/flutter_test.dart';
          import 'package:fatiha_islamic_companion/models/islamic_content.dart';
          void main() {
            test('v0.4 audio metadata round-trips through map serialization', () {
              const item = IslamicContent(category: 'সকাল', titleBn: 'পরীক্ষা', audioUrl: 'https://example.com/audio.mp3', audioLocalPath: '/storage/audio.mp3', audioLicenseNote: 'পরীক্ষামূলক');
              final restored = IslamicContent.fromMap(item.toMap());
              expect(restored.audioUrl, item.audioUrl);
              expect(restored.audioLocalPath, item.audioLocalPath);
              expect(restored.audioLicenseNote, item.audioLicenseNote);
            });
            test('legacy v1 rows load with empty audio metadata', () {
              final restored = IslamicContent.fromMap({'id': 1, 'category': 'সকাল', 'title_bn': 'পুরোনো দোয়া', 'arabic_text': '', 'transliteration_bn': '', 'meaning_bn': '', 'source_reference': '', 'authenticity_note': '', 'is_favorite': 0});
              expect(restored.audioUrl, '');
              expect(restored.audioLocalPath, '');
              expect(restored.audioLicenseNote, '');
            });
          }
          EOF
          flutter test
      - name: Build debug APK
        working-directory: source/fatiha_android
        run: flutter build apk --debug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FATIHA-v0.4-debug-apk
          path: source/fatiha_android/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
